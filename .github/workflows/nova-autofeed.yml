name: NOVA3 automatic task replenishment
on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  issues: write
  pull-requests: read
concurrency:
  group: nova3-autofeed-serial
  cancel-in-progress: false
jobs:
  autofeed:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile merged PRs and create bounded tasks
        run: python -m nova3_team.autofeed --repo "$GITHUB_REPOSITORY" --root .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Refresh honest progress issue
        run: python -m nova3_team.report publish --repo "$GITHUB_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
