name: NOVA task coordinator
on:
  issue_comment:
    types: [created]
  pull_request:
    types: [closed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: read
concurrency:
  group: nova3-task-coordinator
  cancel-in-progress: false
jobs:
  coordinate:
    if: ${{ github.event_name != 'issue_comment' || (!endsWith(github.event.comment.user.login, '[bot]') && startsWith(github.event.comment.body, '/nova ')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Coordinate leases; auto-close linked merged tasks
        run: python -m nova3_team.coordinator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOVA3_ALERT_USER: crjase
          # Pinned deployment identity (public metadata, never secrets).
          # Set once with `gh variable set`; empty values fail closed (exit 6).
          NOVA3_REPOSITORY_ID: ${{ vars.NOVA3_REPOSITORY_ID }}
          NOVA3_OWNER_ID: ${{ vars.NOVA3_OWNER_ID }}
